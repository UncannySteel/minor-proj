<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 930" width="1280" height="930" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arwv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1280" height="930" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1279" height="929" fill="none" stroke="#e2e8f0"/>

  <!-- ============================ title ============================ -->
  <text x="32" y="42" font-size="19" font-weight="700" fill="#0f172a">Issue report classification &#8212; pipeline</text>
  <text x="32" y="64" font-size="11.5" fill="#64748b">NLBSE&#8217;23 benchmark. One command, download to results:</text>
  <text x="356" y="64" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#334155">python -m src.run_all</text>

  <!-- ============================ section: data ============================ -->
  <text x="32" y="100" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#2563eb">DATA</text>
  <line x1="80" y1="96" x2="1248" y2="96" stroke="#e2e8f0"/>

  <!-- box 1 -->
  <rect x="32" y="114" width="270" height="176" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <path d="M32 120 a6 6 0 0 1 6 -6 h258 a6 6 0 0 1 6 6 v22 h-270 z" fill="#eff6ff"/>
  <text x="46" y="136" font-size="12" font-weight="700" fill="#1e40af">1 &#183; ingest</text>
  <text x="288" y="136" font-size="9.5" text-anchor="end" font-family="ui-monospace, Consolas, monospace" fill="#64748b">src/ingest.py</text>
  <text x="46" y="164" font-size="10.5" fill="#334155">train + test .tar.gz fetched on</text>
  <text x="46" y="180" font-size="10.5" fill="#334155">first run &#8212; no account, no key</text>
  <text x="46" y="204" font-size="10.5" fill="#334155">read in 100,000-row chunks</text>
  <text x="46" y="228" font-size="10.5" fill="#334155">train sampled to 150,000 rows</text>
  <text x="46" y="252" font-size="10.5" fill="#334155">test = the official held-out file,</text>
  <text x="46" y="268" font-size="10.5" fill="#334155">used exactly as shipped</text>
  <text x="46" y="284" font-size="9.5" fill="#94a3b8">labels: bug / feature / question / documentation</text>

  <!-- box 2 -->
  <rect x="342" y="114" width="270" height="176" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <path d="M342 120 a6 6 0 0 1 6 -6 h258 a6 6 0 0 1 6 6 v22 h-270 z" fill="#eff6ff"/>
  <text x="356" y="136" font-size="12" font-weight="700" fill="#1e40af">2 &#183; clean</text>
  <text x="598" y="136" font-size="9.5" text-anchor="end" font-family="ui-monospace, Consolas, monospace" fill="#64748b">src/clean.py</text>
  <text x="356" y="162" font-size="10.5" fill="#334155">keep the four valid labels</text>
  <text x="356" y="180" font-size="10.5" fill="#334155">drop empty title or body</text>
  <text x="356" y="198" font-size="10.5" fill="#334155">strip HTML template comments</text>
  <text x="356" y="216" font-size="10.5" fill="#334155">drop bot issues, non-English</text>
  <text x="356" y="234" font-size="10.5" fill="#334155">normalise, placeholder tokens</text>
  <text x="356" y="252" font-size="10.5" fill="#334155">exact + near-duplicate dedup</text>
  <text x="356" y="272" font-size="10.5" font-weight="600" fill="#b91c1c">drop train rows present in test</text>
  <text x="356" y="288" font-size="9.5" fill="#94a3b8">every step logged as attrition evidence</text>

  <!-- box 3 -->
  <rect x="652" y="114" width="270" height="176" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <path d="M652 120 a6 6 0 0 1 6 -6 h258 a6 6 0 0 1 6 6 v22 h-270 z" fill="#eff6ff"/>
  <text x="666" y="136" font-size="12" font-weight="700" fill="#1e40af">3 &#183; metadata features</text>
  <text x="908" y="136" font-size="9.5" text-anchor="end" font-family="ui-monospace, Consolas, monospace" fill="#64748b">src/features.py</text>
  <text x="666" y="162" font-size="10.5" font-weight="600" fill="#334155">25 structural features</text>
  <text x="666" y="186" font-size="10.5" fill="#334155">14 body &#8212; length, code block,</text>
  <text x="666" y="202" font-size="10.5" fill="#334155">traceback, checklist, image,</text>
  <text x="666" y="218" font-size="10.5" fill="#334155">headings, template, caps ratio</text>
  <text x="666" y="242" font-size="10.5" fill="#334155">5 title &#8212; length, self-tagging</text>
  <text x="666" y="266" font-size="10.5" fill="#334155">6 author_association one-hot</text>
  <text x="666" y="286" font-size="9.5" fill="#94a3b8">shape and provenance, not vocabulary</text>

  <!-- box 4 -->
  <rect x="962" y="114" width="286" height="176" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <path d="M962 120 a6 6 0 0 1 6 -6 h274 a6 6 0 0 1 6 6 v22 h-286 z" fill="#eff6ff"/>
  <text x="976" y="136" font-size="12" font-weight="700" fill="#1e40af">4 &#183; split</text>
  <text x="1234" y="136" font-size="9.5" text-anchor="end" font-family="ui-monospace, Consolas, monospace" fill="#64748b">src/splits.py</text>
  <text x="976" y="164" font-size="10.5" fill="#334155">the competition&#8217;s own protocol</text>
  <text x="976" y="188" font-size="10.5" fill="#334155">train &#8594; 90% train / 10% val,</text>
  <text x="976" y="204" font-size="10.5" fill="#334155">stratified on label, seed 42</text>
  <text x="976" y="228" font-size="10.5" fill="#334155">val used for early stopping only</text>
  <text x="976" y="252" font-size="10.5" fill="#334155">test never seen during training</text>
  <text x="976" y="276" font-size="10.5" fill="#334155">inverse-frequency class weights</text>
  <text x="976" y="290" font-size="9.5" fill="#94a3b8">bug + feature are roughly 90% of the data</text>

  <line x1="304" y1="202" x2="338" y2="202" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="614" y1="202" x2="648" y2="202" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="924" y1="202" x2="958" y2="202" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- cache strip -->
  <rect x="342" y="308" width="580" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="358" y="333" font-size="10.5" fill="#475569">cached to</text>
  <text x="418" y="333" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#334155">data/processed/*.parquet</text>
  <text x="586" y="333" font-size="10.5" fill="#475569">and reported as</text>
  <text x="680" y="333" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#334155">results/data_quality.md</text>
  <line x1="477" y1="292" x2="477" y2="304" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arwv)"/>
  <line x1="787" y1="292" x2="787" y2="304" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arwv)"/>

  <!-- ============================ section: model ============================ -->
  <text x="32" y="392" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#7c3aed">MODEL</text>
  <line x1="88" y1="388" x2="1080" y2="388" stroke="#e2e8f0"/>
  <text x="1248" y="392" font-size="9.5" text-anchor="end" font-family="ui-monospace, Consolas, monospace" fill="#64748b">src/model.py &#183; src/train.py</text>

  <text x="32" y="418" font-size="11" fill="#475569">Late fusion, not early: each modality is encoded independently, and the two branches meet only after both have learned their own representation.</text>

  <!-- inputs -->
  <rect x="32" y="446" width="168" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="116" y="470" font-size="11" text-anchor="middle" font-weight="600" fill="#334155">title + body</text>
  <text x="116" y="487" font-size="9.5" text-anchor="middle" fill="#94a3b8">truncated to 192 tokens</text>

  <rect x="32" y="556" width="168" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="116" y="580" font-size="11" text-anchor="middle" font-weight="600" fill="#334155">25 metadata floats</text>
  <text x="116" y="597" font-size="9.5" text-anchor="middle" fill="#94a3b8">scaler fit on train only</text>

  <line x1="202" y1="472" x2="242" y2="472" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="202" y1="582" x2="242" y2="582" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- encoders -->
  <rect x="246" y="436" width="252" height="72" rx="6" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="260" y="457" font-size="11" font-weight="700" fill="#6d28d9">text encoder</text>
  <text x="260" y="477" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#334155">distilbert-base-uncased</text>
  <text x="260" y="495" font-size="10.5" fill="#334155">[CLS] pooled &#8594; 768d</text>
  <text x="484" y="495" font-size="9.5" text-anchor="end" fill="#94a3b8">BiGRU fallback &#8594; 256d</text>

  <rect x="246" y="546" width="252" height="72" rx="6" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="260" y="567" font-size="11" font-weight="700" fill="#6d28d9">metadata encoder</text>
  <text x="260" y="587" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#334155">Linear 25&#8594;64 &#183; ReLU &#183; Drop</text>
  <text x="260" y="605" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#334155">Linear 64&#8594;32 &#183; ReLU &#8594; 32d</text>

  <!-- concat -->
  <path d="M502 472 H548 V508" stroke="#64748b" stroke-width="1.4" fill="none"/>
  <path d="M502 582 H548 V546" stroke="#64748b" stroke-width="1.4" fill="none"/>
  <circle cx="548" cy="527" r="17" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="548" y="533" font-size="15" text-anchor="middle" font-weight="700" fill="#7c3aed">+</text>
  <text x="548" y="604" font-size="9.5" text-anchor="middle" fill="#94a3b8">concat 800d</text>

  <line x1="567" y1="527" x2="606" y2="527" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- fusion -->
  <rect x="610" y="482" width="248" height="90" rx="6" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="624" y="503" font-size="11" font-weight="700" fill="#6d28d9">shared representation</text>
  <text x="624" y="523" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#334155">Dropout 0.3</text>
  <text x="624" y="541" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#334155">Linear 800&#8594;256 &#183; ReLU</text>
  <text x="624" y="559" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#334155">Dropout 0.3</text>

  <line x1="862" y1="527" x2="900" y2="527" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- head -->
  <rect x="904" y="494" width="180" height="66" rx="6" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="918" y="515" font-size="11" font-weight="700" fill="#6d28d9">classifier head</text>
  <text x="918" y="535" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#334155">Linear 256&#8594;4</text>
  <text x="918" y="552" font-size="9.5" fill="#94a3b8">weighted cross-entropy</text>

  <line x1="1088" y1="527" x2="1122" y2="527" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="1132" y="500" font-size="10.5" fill="#334155">bug</text>
  <text x="1132" y="519" font-size="10.5" fill="#334155">feature</text>
  <text x="1132" y="538" font-size="10.5" fill="#334155">question</text>
  <text x="1132" y="557" font-size="10.5" fill="#334155">documentation</text>

  <text x="32" y="640" font-size="10" fill="#94a3b8">AdamW, lr 3e-5, weight decay 0.01, batch 32, 2 epochs, mixed precision on CUDA. The epoch with the best validation Macro-F1 is the one kept.</text>

  <!-- variants strip -->
  <rect x="32" y="656" width="1216" height="62" rx="6" fill="#fdfbff" stroke="#e9d5ff"/>
  <text x="48" y="679" font-size="11" font-weight="700" fill="#6d28d9">three variants, one class</text>
  <text x="48" y="701" font-size="10.5" fill="#475569">the same model and the same training loop, toggled by the</text>
  <text x="358" y="701" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#334155">use_text</text>
  <text x="411" y="701" font-size="10.5" fill="#475569">/</text>
  <text x="421" y="701" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#334155">use_meta</text>
  <text x="479" y="701" font-size="10.5" fill="#475569">flags &#8212; so the comparison is between identical code, not three hand-written models</text>
  <rect x="880" y="669" width="108" height="34" rx="17" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="934" y="691" font-size="10.5" text-anchor="middle" fill="#475569">text only</text>
  <rect x="996" y="669" width="120" height="34" rx="17" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="1056" y="691" font-size="10.5" text-anchor="middle" fill="#475569">metadata only</text>
  <rect x="1124" y="669" width="112" height="34" rx="17" fill="#7c3aed" stroke="#7c3aed"/>
  <text x="1180" y="691" font-size="10.5" text-anchor="middle" font-weight="700" fill="#ffffff">late fusion</text>

  <!-- ============================ section: measure ============================ -->
  <text x="32" y="760" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#059669">MEASURE</text>
  <line x1="104" y1="756" x2="1248" y2="756" stroke="#e2e8f0"/>

  <rect x="32" y="774" width="592" height="120" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="796" font-size="11" font-weight="700" fill="#047857">baselines</text>
  <text x="610" y="796" font-size="9.5" text-anchor="end" font-family="ui-monospace, Consolas, monospace" fill="#64748b">src/baselines.py</text>
  <text x="46" y="822" font-size="10.5" fill="#334155">majority class &#8212; the floor any result has to clear</text>
  <text x="46" y="844" font-size="10.5" fill="#334155">TF-IDF + LogisticRegression &#8212; text without a transformer</text>
  <text x="46" y="866" font-size="10.5" fill="#334155">metadata-only LogisticRegression and MLP &#8212; is the signal there at all</text>
  <text x="46" y="886" font-size="9.5" fill="#94a3b8">published NLBSE&#8217;23 baselines quoted alongside: FastText 0.851, RoBERTa 0.891</text>

  <rect x="656" y="774" width="592" height="120" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="670" y="796" font-size="11" font-weight="700" fill="#047857">evaluation</text>
  <text x="1234" y="796" font-size="9.5" text-anchor="end" font-family="ui-monospace, Consolas, monospace" fill="#64748b">src/evaluate.py</text>
  <text x="670" y="822" font-size="10.5" fill="#334155">accuracy, macro precision / recall / F1, MCC, per-class F1</text>
  <text x="670" y="844" font-size="10.5" fill="#334155">confusion matrices, ROC and precision-recall curves</text>
  <text x="670" y="866" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#334155">results/metrics.md &#183; metrics.csv &#183; *.png</text>
  <text x="670" y="886" font-size="9.5" fill="#94a3b8">--seeds N repeats each variant and reports mean +/- sd; one run sits below the noise floor</text>

  <line x1="328" y1="724" x2="328" y2="744" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arwv)"/>
  <line x1="952" y1="724" x2="952" y2="744" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arwv)"/>

  <text x="32" y="916" font-size="10" fill="#94a3b8">The question the pipeline exists to answer: does fusing structural metadata with a transformer text encoder beat the text encoder alone?</text>
</svg>
